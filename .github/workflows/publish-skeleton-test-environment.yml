name: Publish Package

on:
  push:
    tags:
      - "skeleton-test-environment-v*"

jobs:
  publish-skeleton:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: ./skeleton-test-environment
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://npm.pkg.github.com"
          scope: "@owneraio"

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run build
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
