name: Publish Package

on:
  push:
    tags:
      - "skeleton-v*"

jobs:
  publish-skeleton:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./skeleton
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://npm.pkg.github.com"
          scope: "@owneraio"

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run build
      - name: Publish
        # prereleases (x.y.z-<tag>.n) go under their prerelease dist-tag, never latest
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            TAG=$(echo "$VERSION" | sed -E 's/^[^-]+-([a-zA-Z]+).*/\1/')
            npm publish --tag "$TAG"
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
