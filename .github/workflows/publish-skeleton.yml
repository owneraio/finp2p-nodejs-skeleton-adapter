name: Publish Package

on:
  push:
    tags:
      - "skeleton-v*"

jobs:
  publish-skeleton:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./skeleton
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://npm.pkg.github.com"
          scope: "@owneraio"

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run build

      # A prerelease must not become the version a plain `npm install` picks.
      # `npm publish` with no --tag moves `latest`, so publishing an RC from a
      # branch -- which is the documented way to coordinate a breaking change
      # across repos -- would hand the RC to everyone installing fresh.
      - name: Publish
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [[ "$version" == *-* ]]; then
            echo "publishing prerelease $version under the 'next' tag"
            npm publish --tag next
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
