name: Publish Package

on:
  push:
    tags:
      - "skeleton-v*"

jobs:
  publish-skeleton:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: ./skeleton
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          registry-url: "https://npm.pkg.github.com"
          scope: "@owneraio"

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run build
      # `npm publish` with no --tag moves `latest`, so publishing a prerelease from a
      # branch, which is the documented way to coordinate a change across repos, hands
      # that branch build to everyone who installs the package fresh.
      - name: Publish
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [[ "$version" == *-* ]]; then
            echo "publishing prerelease $version under the 'next' tag"
            npm publish --tag next
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
