name: CI

# Each subproject is built and tested in its own job, installing its
# @owneraio dependencies from GitHub Packages — never from sibling
# directories. If a change here depends on an unpublished change in a
# sibling package, publish a prerelease of that package first and point
# package.json at it (see CLAUDE.md, "Cross-project changes").

on:
  push:
    branches:
      - 'master'
    tags:
      - 'v0.**'
  pull_request:

# Least-privilege GITHUB_TOKEN: checkout + installing @owneraio packages
# from GitHub Packages only need read access.
permissions:
  contents: read
  packages: read

jobs:
  # `npm ci` catches package.json/package-lock.json dependency drift, but not
  # a `version` field edited by hand without `npm version --no-git-tag-version`.
  lockfile-version-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check package.json version matches package-lock.json
        run: |
          fail=0
          for d in finp2p-client skeleton adapter-tests vanilla-service sample-adapter skeleton-test-environment; do
            node -e "
              const p = require('./$d/package.json');
              const l = require('./$d/package-lock.json');
              const lockRoot = l.packages?.['']?.version ?? l.version;
              if (p.version !== l.version || p.version !== lockRoot) {
                console.error('$d: package.json=' + p.version + ' package-lock.json=' + l.version + '/' + lockRoot);
                console.error('$d: bump with \`npm version <ver> --no-git-tag-version\`, never by editing files directly');
                process.exit(1);
              }
            " || fail=1
          done
          exit $fail

  finp2p-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./finp2p-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://npm.pkg.github.com/
          scope: '@owneraio'
      - name: install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: build
        run: npm run build

  skeleton:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./skeleton
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://npm.pkg.github.com/
          scope: '@owneraio'
      - name: install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: build
        run: npm run build
      - name: install migration tool
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@v3.26.0
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
      - name: test
        run: npm run test

  adapter-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./adapter-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://npm.pkg.github.com/
          scope: '@owneraio'
      - name: install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: build
        run: npm run build

  vanilla-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./vanilla-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://npm.pkg.github.com/
          scope: '@owneraio'
      - name: install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: build
        run: npm run build
      - name: install migration tool
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@v3.26.0
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
      - name: test
        run: npm run test

  sample-adapter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./sample-adapter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://npm.pkg.github.com/
          scope: '@owneraio'
      - name: install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: build
        run: npm run build
      - name: install migration tool
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@v3.26.0
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
      - name: test
        run: npm test
