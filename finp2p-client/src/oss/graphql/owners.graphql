query GetOwners(
    $filter: [Filter!],
    $includeCerts: Boolean = true,
    $includeHoldings: Boolean = true,
    $includeNetworkAccounts: Boolean = false
) {
    users(filter: $filter) {
        nodes {
            id
            finIds
            name
            organizationId
            metadata {
                acl
            }
            certificates @include(if: $includeCerts){
                nodes {
                    id
                    type
                    profileId
                    data
                    issuedAt
                    expiry
                    providerId
                    documents {
                        nodes {
                            id
                            name
                            mimeType
                            uri
                        }
                    }
                }
            }
            holdings @include(if: $includeHoldings) {
                nodes {
                    assetType
                    asset {
                        ... asset
                    }
                    balance
                    syncedBalance
                }
            }
            networkAccounts @include(if: $includeNetworkAccounts) {
                organizationId
                assetId
                id
                account {
                    ... networkAccount
                }
            }
        }
    }
}

fragment asset on AssetDetails {
    type: __typename
    ... on FinP2PAsset {
        resourceId
    }
}

# `__typename` is aliased to `kind` rather than `type` because WalletAccount
# already has a field named `type` — aliasing both to the same response key
# would be a field conflict.
fragment networkAccount on NetworkAccount {
    kind: __typename
    ... on WalletAccount {
        type
        address
    }
    ... on Caip10Account {
        network
        address
    }
    ... on CustodialAccount {
        provider
        vaultAccountId
        assetId
    }
}
