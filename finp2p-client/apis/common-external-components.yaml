components:
  schemas:
    customMetadata:
      type: object
      description: >
        Optional. A map of key:value string pairs for custom tracing, reconciliation, and business context. Opaque to the Router.

      additionalProperties:
        type: string
        minLength: 1
    APIError:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          description: |
            Error code indicating the specific failure - for more information see [API Errors](./api-error-codes-reference).
        message:
          type: string
          description: A descriptive message providing context about the error.
          pattern: .*\S.*
          x-autoMinLength: true
    APIErrors:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/APIError"
    APIErrorsTyped:
      type: object
      required: [errors, type]
      properties:
        type:
          type: string
          enum: ["error"]
        errors:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/APIError"
    orgId:
      type: string
      description: 'Organization Id'
      maxLength: 150
      # language=regexp
      pattern: '^[^:]*$' # TODO after we validate ORGID setting replace with actual org id pattern '^[a-zA-Z0-9]+(-[a-zA-Z0-9]+)*$'
      x-go-type: OrgIdValidatable
      minLength: 1
      x-autoMinLength: true
    finId:
      type: string
      format: finid
      description: 'Existing owner hex representation of a secp256k1 public key 33 bytes compressed'
      # language=regexp
      pattern: '^[0-9a-f]*$'
      minLength: 64
      maxLength: 66
      x-autoMinLength: true
    ApproveExecutionPlanRequest:
      type: object
      required:
        - executionPlan
      properties:
        executionPlan:
          type: object
          description: execution plan information
          required: [id]
          properties:
            id:
              type: string
              description: execution plan id
              pattern: .*\S.*
              x-autoMinLength: true
    ApproveExecutionPlanResponse:
      allOf:
        - $ref: '#/components/schemas/ExecutionPlanApprovalOperation'
    executionPlanProposalRequest:
      type: object
      required:
        - executionPlan
      properties:
        executionPlan:
          type: object
          description: execution plan information
          required: [id, proposal]
          properties:
            id:
              type: string
              description: execution plan id
              pattern: .*\S.*
              x-autoMinLength: true
            proposal:
              type: object
              description: type of proposal payload
              oneOf:
                - $ref: '#/components/schemas/executionPlanCancellationProposal'
                - $ref: '#/components/schemas/executionPlanInstructionProposal'
                - $ref: '#/components/schemas/executionPlanResetProposal'
              #                        - $ref: '#/components/schemas/executionPlanProposal'
              discriminator:
                propertyName: proposalType
                mapping:
                  cancel: '#/components/schemas/executionPlanCancellationProposal'
                  reset: '#/components/schemas/executionPlanResetProposal'
                  instruction: '#/components/schemas/executionPlanInstructionProposal'
    #                          plan: '#/components/schemas/executionPlanProposal'

    executionPlanInstructionProposal:
      type: object
      required: [proposalType, instructionSequence]
      properties:
        proposalType:
          type: string
          enum: ['instruction']
        instructionSequence:
          type: integer
          format: uint32
          minimum: 1
          description: sequence number of the instruction completion event
    executionPlanProposalStatusRequest:
      type: object
      description: provides status update on the agreement reached for a specific proposal
      required: [status, request]
      properties:
        status:
          type: string
          enum: ["approved", "rejected"]
        request:
          allOf:
            - $ref: '#/components/schemas/executionPlanProposalRequest'
    executionPlanCancellationProposal:
      type: object
      required: [proposalType]
      properties:
        proposalType:
          type: string
          enum: ['cancel']
    executionPlanResetProposal:
      type: object
      required: [proposalType, proposedSequence]
      properties:
        proposalType:
          type: string
          enum: ['reset']
        proposedSequence:
          type: integer
          format: uint32
          minimum: 1
          description: sequence number of the instruction to reset and retry in the execution plan
    executionPlanProposal:
      type: object
      required: [proposalType]
      properties:
        proposalType:
          type: string
          enum: ['plan']
    ApiErrorClient4XX:
      type: object
      deprecated: true
      description: |
        **Deprecated.** Use the standard `APIErrors` schema instead. All 4xx error
        responses now follow the shared error format with Ownera error codes.
      required: [status, errors, type]
      properties:
        type:
          type: string
          enum: ["error"]
        status:
          type: integer
          enum: [400, 401, 403, 404, 409]
          x-go-json-ignore: true
          x-enumNames: ['value']
        errors:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/AssetMetadataAndConfigError'
              - $ref: '#/components/schemas/GeneralClientError'
    # 10xx General Client Errors
    GeneralClientError:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          enum: [1000]
        message:
          type: string
          enum: ['General client error']
    AssetMetadataAndConfigError:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          enum: [4108]
        message:
          type: string
          enum: ['Asset metadata and config cannot be provided at the same time']
    ApiErrorServer5XX:
      type: object
      deprecated: true
      description: |
        **Deprecated.** Use the standard `APIErrors` schema instead. All 5xx error
        responses now follow the shared error format with Ownera error codes.
      required: [status, errors, type]
      properties:
        type:
          type: string
          enum: ["error"]
        status:
          type: integer
          enum: [500, 502, 503, 504]
          x-go-json-ignore: true
          x-enumNames: ['value']
        errors:
          type: array
          items:
            $ref: '#/components/schemas/GeneralServerError'
    # 20xx General Server Errors
    GeneralServerError:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          enum: [2000]
        message:
          type: string
          enum: ['General server error']
    ApiAnyError:
      deprecated: true
      description: |
        **Deprecated.** Use the standard `APIErrors` schema instead. All error
        responses now follow the shared error format with Ownera error codes.
      allOf:
        - oneOf:
            - $ref: '#/components/schemas/ApiErrorClient4XX'
            - $ref: '#/components/schemas/ApiErrorServer5XX'
        - type: object
          required: [type]
          properties:
            type:
              type: string
              enum: ['error']
    CustomError:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
        message:
          type: string
          pattern: .*\S.*
          x-autoMinLength: true
    HealthCheckOperation:
      allOf:
        - $ref: '#/components/schemas/OperationBase'
        - $ref: '#/components/schemas/HealthResponse'
    HealthResponse:
      type: object
      required: [health]
      properties:
        health:
          type: object
          required: [status]
          properties:
            status:
              type: string
              example: 'ok/unavailable'
              pattern: .*\S.*
              x-autoMinLength: true
    PlanApproved:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: ['approved']
    PlanRejected:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: ['rejected']
        failure:
          oneOf:
            - $ref: '#/components/schemas/ValidationFailure'
            - $ref: '#/components/schemas/RegulationFailure'
          discriminator:
            propertyName: failureType
            mapping:
              validationFailure: '#/components/schemas/ValidationFailure'
              regulationFailure: '#/components/schemas/RegulationFailure'
    ExecutionPlanApprovalOperation:
      allOf:
        - $ref: '#/components/schemas/OperationBase'
        - $ref: '#/components/schemas/PlanApprovalResponse'
    PlanApprovalResponse:
      type: object
      properties:
        approval:
          oneOf:
            - $ref: '#/components/schemas/PlanApproved'
            - $ref: '#/components/schemas/PlanRejected'
          discriminator:
            propertyName: status
            mapping:
              approved: '#/components/schemas/PlanApproved'
              rejected: '#/components/schemas/PlanRejected'
    ValidationFailure:
      type: object
      required:
        - failureType
        - code
        - message
      properties:
        failureType:
          type: string
          enum: [validationFailure]
        code:
          type: integer
          format: uint32
          description: ledger error code for validation
        message:
          type: string
          pattern: .*\S.*
          x-autoMinLength: true
    RegulationFailure:
      type: object
      required:
        - failureType
        - errors
      properties:
        failureType:
          type: string
          enum: [regulationFailure]
        errors:
          type: array
          items:
            $ref: '#/components/schemas/RegulationError'
    RegulationError:
      type: object
      required:
        - regulationType
        - details
      properties:
        regulationType:
          type: string
          description: the type of regulation
          pattern: .*\S.*
          x-autoMinLength: true
        details:
          type: string
          description: actionable details of the error
          pattern: .*\S.*
          x-autoMinLength: true
    OperationBase:
      type: object
      required:
        - cid
        - isCompleted
      properties:
        cid:
          type: string
          description: unique correlation id which identify the operation
          x-allowEmpty: true
        isCompleted:
          type: boolean
          description: flag indicating if the operation completed, if true then error or response must be present (but not both)
          default: false
        operationMetadata:
          $ref: '#/components/schemas/OperationMetadata'
    OperationMetadata:
      type: object
      description: additional metadata regarding the operation
      properties:
        operationResponseStrategy:
          description: "denote the expected response strategy of the operation, i.e. how would completion and results of the operation should be handled \noptional, if not provided [polling strategy](#/components/schema/pollingResultsStrategy) will be use with [random interval](#/components/schema/randomPollingInterval)\n"
          type: object
          oneOf:
            - $ref: '#/components/schemas/pollingResultsStrategy'
            - $ref: '#/components/schemas/callbackResultsStrategy'
          discriminator:
            propertyName: type
            mapping:
              poll: '#/components/schemas/pollingResultsStrategy'
              callback: '#/components/schemas/callbackResultsStrategy'
    callbackResultsStrategy:
      type: object
      required: [type, callback]
      properties:
        type:
          type: string
          enum: [callback]
        callback:
          type: object
          oneOf:
            - $ref: '#/components/schemas/callbackEndpoint'
          discriminator:
            propertyName: type
            mapping:
              endpoint: '#/components/schemas/callbackEndpoint'
    callbackEndpoint:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [endpoint]
    pollingResultsStrategy:
      type: object
      required: [type, polling]
      properties:
        type:
          type: string
          enum: [poll]
        polling:
          type: object
          oneOf:
            - $ref: '#/components/schemas/randomPollingInterval'
            - $ref: '#/components/schemas/absolutePollingInterval'
            - $ref: '#/components/schemas/relativePollingInterval'
          discriminator:
            propertyName: type
            mapping:
              random: '#/components/schemas/randomPollingInterval'
              absolute: '#/components/schemas/absolutePollingInterval'
              relative: '#/components/schemas/relativePollingInterval'
    relativePollingInterval:
      type: object
      required: [type, duration]
      properties:
        type:
          type: string
          enum: [relative]
        duration:
          type: string
          description: ISO-8601 duration format
          example: PT5M (5Min duration), P1DT30M (1 Day and 30 Minutes )
          pattern: .*\S.*
          x-autoMinLength: true
    absolutePollingInterval:
      type: object
      required: [type, time]
      properties:
        type:
          type: string
          enum: [absolute]
        time:
          type: integer
          description: absolute time as epoch time seconds
    randomPollingInterval:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [random]
    paymentMethods:
      type: array
      items:
        $ref: '#/components/schemas/paymentMethod'
    paymentMethod:
      type: object
      required: [description, currency, methodInstruction]
      properties:
        description:
          type: string
          pattern: .*\S.*
          x-autoMinLength: true
        currency:
          type: string
          description: accepted currency for payment
          pattern: .*\S.*
          x-autoMinLength: true
        methodInstruction:
          oneOf:
            - $ref: '#/components/schemas/wireTransfer'
            - $ref: '#/components/schemas/wireTransferUSA'
            - $ref: '#/components/schemas/cryptoTransfer'
            - $ref: '#/components/schemas/paymentInstructions'
          discriminator:
            propertyName: type
            mapping:
              wireTransfer: '#/components/schemas/wireTransfer'
              wireTransferUSA: '#/components/schemas/wireTransferUSA'
              cryptoTransfer: '#/components/schemas/cryptoTransfer'
              paymentInstructions: '#/components/schemas/paymentInstructions'
    paymentInstructions:
      type: object
      required: [type, instruction]
      properties:
        type:
          type: string
          enum: ['paymentInstructions']
        instruction:
          type: "string"
          pattern: .*\S.*
          x-autoMinLength: true
    cryptoTransfer:
      type: object
      required: [type, network, contractAddress, walletAddress]
      properties:
        type:
          type: string
          enum: ['cryptoTransfer']
        network:
          type: string
          pattern: .*\S.*
          x-autoMinLength: true
        contractAddress:
          type: string
          pattern: .*\S.*
          x-autoMinLength: true
        walletAddress:
          type: string
          pattern: .*\S.*
          x-autoMinLength: true
    wireTransferUSA:
      type: object
      required: [type, accountNumber, routingNumber]
      properties:
        type:
          type: string
          enum: ['wireTransferUSA']
        accountNumber:
          type: string
          pattern: .*\S.*
          x-autoMinLength: true
        routingNumber:
          type: string
          pattern: .*\S.*
          x-autoMinLength: true
        line1:
          type: string
          pattern: .*\S.*
          x-autoMinLength: true
        city:
          type: string
          pattern: .*\S.*
          x-autoMinLength: true
        postalCode:
          type: string
          pattern: .*\S.*
          x-autoMinLength: true
        country:
          type: string
          pattern: .*\S.*
          x-autoMinLength: true
        state:
          type: string
          pattern: .*\S.*
          x-autoMinLength: true
    wireTransfer:
      type: object
      required: [type, accountHolderName, bankName, wireDetails]
      properties:
        type:
          type: string
          enum: ['wireTransfer']
        accountHolderName:
          type: string
          pattern: .*\S.*
          x-autoMinLength: true
        bankName:
          type: string
          pattern: .*\S.*
          x-autoMinLength: true
        wireDetails:
          $ref: '#/components/schemas/wireDetails'
        line1:
          type: string
          pattern: .*\S.*
          x-autoMinLength: true
        city:
          type: string
          pattern: .*\S.*
          x-autoMinLength: true
        postalCode:
          type: string
          pattern: .*\S.*
          x-autoMinLength: true
        country:
          type: string
          pattern: .*\S.*
          x-autoMinLength: true
    wireDetails:
      discriminator:
        propertyName: type
        mapping:
          iban: '#/components/schemas/ibanAccountDetails'
          swift: '#/components/schemas/swiftAccountDetails'
          sortCode: '#/components/schemas/sortCodeDetails'
      oneOf:
        - $ref: '#/components/schemas/ibanAccountDetails'
        - $ref: '#/components/schemas/swiftAccountDetails'
        - $ref: '#/components/schemas/sortCodeDetails'
    ibanAccountDetails:
      type: object
      required: [type, iban]
      properties:
        type:
          type: string
          enum: ['iban']
        iban:
          type: string
          pattern: .*\S.*
          x-autoMinLength: true
    swiftAccountDetails:
      type: object
      required: [type, swiftCode, accountNumber]
      properties:
        type:
          type: string
          enum: ['bic']
        swiftCode:
          type: string
          pattern: .*\S.*
          x-autoMinLength: true
        accountNumber:
          type: string
          pattern: .*\S.*
          x-autoMinLength: true
    sortCodeDetails:
      type: object
      required: [type, code, accountNumber]
      properties:
        type:
          type: string
          enum: ['sortCode']
        code:
          type: string
          description: sort code has XX-XX-XX format
          pattern: "^\\d{2}-\\d{2}-\\d{2}$"
        accountNumber:
          type: string
          pattern: .*\S.*
          x-autoMinLength: true
    assetName:
      type: string
      pattern: '^[a-zA-Z0-9\-_. /]*$'
      maxLength: 150
      description: The name of the asset
      minLength: 1
      x-autoMinLength: true
    ownerResourceId:
      type: string
      description: 'Owner resource id'
      pattern: '^[^:](?:.+):101:(?:.+)'
      maxLength: 150
      example: 'bank-x:101:511c1d7f-4ed8-410d-887c-a10e3e499a01'
    walletAccount:
      type: object
      required:
        - type
        - address
      properties:
        type:
          type: string
          enum: ['walletAccount']
        address:
          type: string
          description: 'address of the wallet'
          pattern: .*\S.*
          x-autoMinLength: true
    noneAccount:
      type: object
      additionalProperties: false
    caip10Account:
      type: object
      required:
        - type
        - network
        - address
      properties:
        type:
          type: string
          enum: ['caip10Account']
        network:
          type: string
          description: 'CAIP-2 chain_id, e.g. "eip155:1", "solana:5eykt4...", "hedera:mainnet" (the same token used by the CAIP-19 asset identifier network)'
          pattern: .*\S.*
          x-autoMinLength: true
        address:
          type: string
          description: 'CAIP-10 account_address (chain-native address)'
          pattern: .*\S.*
          x-autoMinLength: true
          maxLength: 128
    custodialAccount:
      type: object
      required:
        - type
        - provider
        - vaultAccountId
      properties:
        type:
          type: string
          enum: ['custodialAccount']
        provider:
          type: string
          description: 'Custody provider discriminator, e.g. "fireblocks"'
          pattern: .*\S.*
          x-autoMinLength: true
        vaultAccountId:
          type: string
          description: 'Provider-internal account identifier (e.g. a Fireblocks vault account id)'
          pattern: .*\S.*
          x-autoMinLength: true
        assetId:
          type: string
          description: 'Optional. Narrows the custodial account to a specific asset/chain.'
          pattern: .*\S.*
          x-autoMinLength: true
    networkAccount:
      oneOf:
        - $ref: '#/components/schemas/walletAccount'
        - $ref: '#/components/schemas/caip10Account'
        - $ref: '#/components/schemas/custodialAccount'
        - $ref: '#/components/schemas/noneAccount'
    financialAssetIdentifier:
      description: >
        Globally recognized code identifying the asset across networks, routers, and counterparties. Used for balance aggregation and cross-router asset recognition. Format is validated for structure only.

      oneOf:
        - $ref: '#/components/schemas/financialAssetIdentifierTypeISIN'
        - $ref: '#/components/schemas/financialAssetIdentifierTypeISO4217'
        - $ref: '#/components/schemas/financialAssetIdentifierTypeNONE'
      discriminator:
        propertyName: assetIdentifierType
        mapping:
          ISIN: '#/components/schemas/financialAssetIdentifierTypeISIN'
          ISO4217: '#/components/schemas/financialAssetIdentifierTypeISO4217'
          NONE: '#/components/schemas/financialAssetIdentifierTypeNONE'
    financialAssetIdentifierTypeISIN:
      description: Financial instruments (equities, bonds, funds, etc.). 12-character ISO 6166 code.
      type: object
      required: [assetIdentifierType, assetIdentifierValue]
      properties:
        assetIdentifierType:
          type: string
          enum: [ISIN]
          description: Classification type standards
        assetIdentifierValue:
          type: string
          description: The classification standard used to identify the asset
          pattern: '^[A-Z]{2}[A-Z0-9]{10}$'
          x-autoMinLength: true
    financialAssetIdentifierTypeNONE:
      description: Asset is not registered under a global identification scheme.
      type: object
      required: [assetIdentifierType]
      properties:
        assetIdentifierType:
          type: string
          enum: [NONE]
          description: Classification type standards
    financialAssetIdentifierTypeISO4217:
      description: Fiat currencies.
      type: object
      required: [assetIdentifierType, assetIdentifierValue]
      properties:
        assetIdentifierType:
          type: string
          enum: [ISO4217]
          description: Classification type standards
        assetIdentifierValue:
          type: string
          description: The classification standard used to identify the asset
          pattern: '^(AED|AFN|ALL|AMD|ANG|AOA|ARS|AUD|AWG|AZN|BAM|BBD|BDT|BGN|BHD|BIF|BMD|BND|BOB|BRL|BSD|BTN|BWP|BYR|BZD|CAD|CDF|CHF|CLP|CNY|COP|CRC|CUC|CUP|CVE|CZK|DJF|DKK|DOP|DZD|EGP|ERN|ETB|EUR|FJD|FKP|GBP|GEL|GGP|GHS|GIP|GMD|GNF|GTQ|GYD|HKD|HNL|HRK|HTG|HUF|IDR|ILS|IMP|INR|IQD|IRR|ISK|JEP|JMD|JOD|JPY|KES|KGS|KHR|KMF|KPW|KRW|KWD|KYD|KZT|LAK|LBP|LKR|LRD|LSL|LYD|MAD|MDL|MGA|MKD|MMK|MNT|MOP|MRO|MUR|MVR|MWK|MXN|MYR|MZN|NAD|NGN|NIO|NOK|NPR|NZD|OMR|PAB|PEN|PGK|PHP|PKR|PLN|PYG|QAR|RON|RSD|RUB|RWF|SAR|SBD|SCR|SDG|SEK|SGD|SHP|SLL|SOS|SPL|SRD|STD|SVC|SYP|SZL|THB|TJS|TMT|TND|TOP|TRY|TTD|TVD|TWD|TZS|UAH|UGX|USD|UYU|UZS|VEF|VND|VUV|WST|XAF|XCD|XDR|XOF|XPF|YER|ZAR|ZMW|ZWD)$'
    ledgerAssetIdentifier:
      oneOf:
        - $ref: '#/components/schemas/ledgerAssetIdentifierTypeCAIP-19'
      discriminator:
        propertyName: assetIdentifierType
        mapping:
          CAIP-19: '#/components/schemas/ledgerAssetIdentifierTypeCAIP-19'
    ledgerAssetIdentifierTypeCAIP-19:
      type: object
      required: [assetIdentifierType, tokenId]
      properties:
        assetIdentifierType:
          type: string
          enum: [CAIP-19]
          description: Classification type standards
        network:
          type: string
          pattern: .*\S.*
          x-autoMinLength: true
        tokenId:
          type: string
          pattern: .*\S.*
          x-autoMinLength: true
        standard:
          type: string
          pattern: .*\S.*
          x-autoMinLength: true
    ledgerAssetIdentifierCreateOrBind:
      description: >
        Ledger asset identifier accepted when creating an asset profile. With tokenId present it
        binds the profile to an existing on-ledger token. Without tokenId it instructs the ledger
        to create a new token on the given network/standard; the ledger mints the token, and the
        full resulting identifier is persisted on the profile.
      oneOf:
        - $ref: '#/components/schemas/ledgerAssetIdentifierTypeCAIP-19CreateOrBind'
      discriminator:
        propertyName: assetIdentifierType
        mapping:
          CAIP-19: '#/components/schemas/ledgerAssetIdentifierTypeCAIP-19CreateOrBind'
    ledgerAssetIdentifierTypeCAIP-19CreateOrBind:
      type: object
      required: [assetIdentifierType]
      properties:
        assetIdentifierType:
          type: string
          enum: [CAIP-19]
          description: Classification type standards
        network:
          type: string
          pattern: .*\S.*
          x-autoMinLength: true
        tokenId:
          type: string
          description: >
            Identifier of an existing on-ledger token to bind to. Omit to have the ledger create a
            new token on the given network/standard.
          pattern: .*\S.*
          x-autoMinLength: true
        standard:
          type: string
          pattern: .*\S.*
          x-autoMinLength: true
    networkInfo:
      type: object
      required: [networkId]
      description: Additional network information for the asset identifier
      properties:
        networkId:
          type: string
          description: Identifier of the network associated with the asset (e.g., blockchain network name or code).
          pattern: .*\S.*
          x-autoMinLength: true
    assetDenominationType:
      type: string
      enum: [finp2p, fiat, cryptocurrency]
      description: Indicates how the asset is denominated
    assetDenomination:
      type: object
      required: [type, code]
      properties:
        type:
          $ref: '#/components/schemas/assetDenominationType'
        code:
          type: string
          description: Unique code identifying the denomination asset type
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9.\-]*$'
          maxLength: 150
          minLength: 1
    assetType:
      type: string
      enum: [Equity, Debt, Loans, Fund, RealEstate, Commodity, Fiat, Cryptocurrency, TokenizedCash, DigitalNatives, Basket, Other]
      pattern: '^[a-zA-Z0-9\- ]*$'
      description: "The type of the asset \nPayment asset classification:\n- Fiat: Government-issued currencies identified by ISO 4217 codes (e.g., USD, EUR, GBP)\n- Cryptocurrency: Blockchain-based digital currencies identified by appropriate crypto identifiers (e.g., BTC, ETH)\n- TokenizedCash: Blockchain-based digital cash maintaining 1:1 fiat peg (stablecoins, deposit tokens, CBDCs)\n"
      maxLength: 150
    finIdAccount:
      type: object
      required: [type, finId, orgId, custodian]
      properties:
        type:
          type: string
          enum: ['finId']
        finId:
          $ref: "#/components/schemas/finId"
        orgId:
          $ref: '#/components/schemas/orgId'
        custodian:
          $ref: '#/components/schemas/custodian'
    finp2pAssetAccount:
      type: object
      description: 'describes account and asset information'
      required: [account, asset]
      properties:
        account:
          $ref: '#/components/schemas/finIdAccount'
        asset:
          $ref: '#/components/schemas/finp2pAsset'
        networkAccount:
          $ref: '#/components/schemas/networkAccount'
          description: |
            Optional. Investor network account to use for this leg. Must have been
            previously bound via `POST /profiles/investor/{investorId}/account`.
            Whitelist-validated against `investor.data.accounts[org][asset]`
            before forwarding to the LA. Failure → error code 7351 (AccountNotWhitelistedErr, 400).
    finp2pAssetWithNoAccount:
      type: object
      description: 'describes asset information'
      required: [asset]
      properties:
        asset:
          $ref: '#/components/schemas/finp2pAsset'
    finp2pAsset:
      type: object
      description: 'describes asset information'
      required: [id, ledgerIdentifier]
      properties:
        id:
          $ref: '#/components/schemas/resourceId'
        ledgerIdentifier:
          $ref: '#/components/schemas/ledgerAssetIdentifier'
    ledgerAccountAsset:
      type: object
      description: 'describes account information'
      required: [finp2pAccount]
      properties:
        finp2pAccount:
          $ref: '#/components/schemas/finp2pAssetAccount'
        networkAccount:
          $ref: '#/components/schemas/networkAccount'
    finp2pAssetAccountOptional:
      type: object
      description: 'describes account information'
      required: [asset]
      properties:
        account:
          $ref: '#/components/schemas/finIdAccount'
        asset:
          $ref: '#/components/schemas/finp2pAsset'
        networkAccount:
          $ref: '#/components/schemas/networkAccount'
          description: |
            Optional. Investor network account to use for this leg. Must have been
            previously bound via `POST /profiles/investor/{investorId}/account`.
            Whitelist-validated against `investor.data.accounts[org][asset]`
            before forwarding to the LA. Failure → error code 7351 (AccountNotWhitelistedErr, 400).
    importTxAccount:
      type: object
      required:
        - finId
      properties:
        finId:
          $ref: "#/components/schemas/finId"
    importTxAssetAccount:
      type: object
      description: 'describes account information'
      required: [account, asset]
      properties:
        account:
          $ref: '#/components/schemas/importTxAccount'
        asset:
          $ref: '#/components/schemas/finp2pAsset'
    importTxLedgerAssetAccount:
      type: object
      description: 'describes account information'
      required: [finp2pAccount]
      properties:
        finp2pAccount:
          $ref: '#/components/schemas/importTxAssetAccount'
        networkAccount:
          $ref: '#/components/schemas/networkAccount'
    custodian:
      type: object
      required: [orgId]
      properties:
        orgId:
          $ref: '#/components/schemas/orgId'
    resourceId:
      type: string
      description: 'finp2p resource id format'
      pattern: '^[^:](?:.+):(101|102|103|104|105):(?:.+)'
      maxLength: 150
      example: 'bank-x:101:9929ccaf-8967-4ba3-9198-a4b8e3128388'
    receiptAssetDetails:
      type: object
      required: [transactionDetails]
      properties:
        transactionDetails:
          $ref: '#/components/schemas/receiptTransactionDetails'
    receiptTransactionDetails:
      description: Additional input and output details for UTXO supporting DLTs
      type: object
      required:
        - transactionId
      properties:
        transactionId:
          type: string
          description: Transaction id
          pattern: .*\S.*
          x-autoMinLength: true
        operationId:
          type: string
          description: Operation id
          pattern: .*\S.*
          x-autoMinLength: true
    receiptTradeDetails:
      type: object
      properties:
        intentId:
          type: string
          pattern: .*\S.*
          x-autoMinLength: true
        intentVersion:
          type: string
          pattern: .*\S.*
          x-autoMinLength: true
        executionContext:
          $ref: '#/components/schemas/receiptExecutionContext'
    receiptExecutionContext:
      type: object
      required: [executionPlanId, instructionSequenceNumber]
      properties:
        executionPlanId:
          type: string
          pattern: .*\S.*
          x-autoMinLength: true
        instructionSequenceNumber:
          type: integer
    nonce:
      type: string
      description: |
        32 bytes buffer (24 randomly generated bytes by the client + 8 bytes epoch timestamp seconds) encoded to hex:

          const nonce = Buffer.alloc(32);
          nonce.fill(crypto.randomBytes(24), 0, 24);

          const nowEpochSeconds = Math.floor(new Date().getTime() / 1000);
          const t = BigInt(nowEpochSeconds);
          nonce.writeBigInt64BE(t, 24);
      x-allowEmpty: true
    ownerId:
      type: string
      description: 'The Owner resource id'
      pattern: '^[^:](?:.+):101:(?:.+)'
      maxLength: 150
      example: 'bank-x:101:511c1d7f-4ed8-410d-887c-a10e3e499a01'
    # Intent Schemas
    intentType:
      type: string
      enum: ['primarySale', 'buyingIntent', 'sellingIntent', 'loanIntent', 'redemptionIntent', 'privateOfferIntent', 'requestForTransferIntent', 'moveIntent']
    intent:
      type: object
      oneOf:
        - $ref: '#/components/schemas/primarySale'
        - $ref: '#/components/schemas/buyingIntent'
        - $ref: '#/components/schemas/sellingIntent'
        - $ref: '#/components/schemas/loanIntent'
        - $ref: '#/components/schemas/redemptionIntent'
        - $ref: '#/components/schemas/privateOfferIntent'
        - $ref: '#/components/schemas/requestForTransferIntent'
        - $ref: '#/components/schemas/moveIntent'
      discriminator:
        propertyName: type
        mapping:
          primarySale: '#/components/schemas/primarySale'
          buyingIntent: '#/components/schemas/buyingIntent'
          sellingIntent: '#/components/schemas/sellingIntent'
          loanIntent: '#/components/schemas/loanIntent'
          redemptionIntent: '#/components/schemas/redemptionIntent'
          privateOfferIntent: '#/components/schemas/privateOfferIntent'
          requestForTransferIntent: '#/components/schemas/requestForTransferIntent'
          moveIntent: '#/components/schemas/moveIntent'
    primarySale:
      type: object
      required: [type, issuer, asset, settlement]
      properties:
        type:
          type: string
          enum: [primarySale]
        issuer:
          $ref: '#/components/schemas/ownerId'
        asset:
          $ref: '#/components/schemas/sellingAsset'
        settlement:
          $ref: '#/components/schemas/sellingSettlements'
    buyingIntent:
      type: object
      required: [type, buyer, asset, settlement]
      properties:
        type:
          type: string
          enum: [buyingIntent]
        buyer:
          type: string
          description: 'resource id of the buyer'
          pattern: .*\S.*
          x-autoMinLength: true
        asset:
          $ref: '#/components/schemas/buyingAsset'
        settlement:
          $ref: '#/components/schemas/buyingSettlementBase'
        settlements:
          type: array
          items:
            type: object
            required: [legs]
            properties:
              legs:
                type: array
                minItems: 1
                items:
                  $ref: '#/components/schemas/buyingSettlementBase'
        signaturePolicy:
          oneOf:
            - $ref: '#/components/schemas/presignedSignaturePolicy'
            - $ref: '#/components/schemas/manualSignaturePolicy'
          discriminator:
            propertyName: type
            mapping:
              presignedPolicy: '#/components/schemas/presignedSignaturePolicy'
              manualPolicy: '#/components/schemas/manualSignaturePolicy'
    sellingIntent:
      type: object
      required: [type, seller, asset, settlement]
      properties:
        type:
          type: string
          enum: [sellingIntent]
        seller:
          $ref: '#/components/schemas/ownerId'
        asset:
          $ref: '#/components/schemas/sellingAsset'
        settlement:
          $ref: '#/components/schemas/sellingSettlements'
        settlements:
          type: array
          items:
            type: object
            required: [legs]
            properties:
              legs:
                type: array
                minItems: 1
                items:
                  $ref: '#/components/schemas/sellingSettlementBase'
        signaturePolicy:
          oneOf:
            - $ref: '#/components/schemas/presignedSignaturePolicy'
            - $ref: '#/components/schemas/manualSignaturePolicy'
          discriminator:
            propertyName: type
            mapping:
              presignedPolicy: '#/components/schemas/presignedSignaturePolicy'
              manualPolicy: '#/components/schemas/manualSignaturePolicy'
    loanIntent:
      type: object
      required: [type, creatorType, borrower, lender, asset, settlement]
      properties:
        type:
          type: string
          enum: [loanIntent]
        creatorType:
          type: string
          enum: [borrower, lender]
        borrower:
          $ref: '#/components/schemas/ownerId'
        lender:
          $ref: '#/components/schemas/ownerId'
        asset:
          $ref: '#/components/schemas/loanIntentAsset'
        settlement:
          $ref: '#/components/schemas/loanIntentSettlements'
        loanInstruction:
          $ref: '#/components/schemas/loanInstruction'
        signaturePolicy:
          oneOf:
            - $ref: '#/components/schemas/presignedSignaturePolicy'
          discriminator:
            propertyName: type
            mapping:
              presignedPolicy: '#/components/schemas/presignedSignaturePolicy'
    redemptionIntent:
      type: object
      required: [type, issuer, asset, settlement]
      properties:
        type:
          type: string
          enum: [redemptionIntent]
        issuer:
          $ref: '#/components/schemas/ownerId'
        asset:
          $ref: '#/components/schemas/redemptionAsset'
        settlement:
          $ref: '#/components/schemas/buyingSettlements'
        conditions:
          $ref: '#/components/schemas/redemptionIntentConditions'
        signaturePolicy:
          oneOf:
            - $ref: '#/components/schemas/presignedSignaturePolicy'
            - $ref: '#/components/schemas/manualSignaturePolicy'
          discriminator:
            propertyName: type
            mapping:
              presignedPolicy: '#/components/schemas/presignedSignaturePolicy'
              manualPolicy: '#/components/schemas/manualSignaturePolicy'
    privateOfferIntent:
      type: object
      required: [type, buyer, seller, asset, settlement]
      properties:
        type:
          type: string
          enum: [privateOfferIntent]
        buyer:
          $ref: '#/components/schemas/ownerId'
        seller:
          $ref: '#/components/schemas/ownerId'
        asset:
          $ref: '#/components/schemas/privateOfferIntentAsset'
        settlement:
          $ref: '#/components/schemas/sellingSettlements'
        settlements:
          type: array
          items:
            type: object
            required: [legs]
            properties:
              legs:
                type: array
                minItems: 1
                items:
                  $ref: '#/components/schemas/sellingSettlementBase'
        signaturePolicy:
          oneOf:
            - $ref: '#/components/schemas/presignedSignaturePolicy'
            - $ref: '#/components/schemas/manualSignaturePolicy'
          discriminator:
            propertyName: type
            mapping:
              presignedPolicy: '#/components/schemas/presignedSignaturePolicy'
              manualPolicy: '#/components/schemas/manualSignaturePolicy'
    moveIntent:
      type: object
      # A Move intent carries no issuer — it is an org-level migration declared by
      # the source asset's own organization (creation is restricted to that org).
      required: [type, asset]
      properties:
        type:
          type: string
          enum: [moveIntent]
        asset:
          $ref: '#/components/schemas/moveAsset'
        signaturePolicy:
          oneOf:
            - $ref: '#/components/schemas/presignedSignaturePolicy'
            - $ref: '#/components/schemas/manualSignaturePolicy'
          discriminator:
            propertyName: type
            mapping:
              presignedPolicy: '#/components/schemas/presignedSignaturePolicy'
              manualPolicy: '#/components/schemas/manualSignaturePolicy'
    moveDestination:
      type: object
      description: 'a Move destination asset. Superset of finp2pAsset (same required id + ledgerIdentifier), plus an optional pre-funded pool the Transfer drains into the destination for the hold-transfer-* variants.'
      required: [id, ledgerIdentifier]
      properties:
        id:
          $ref: '#/components/schemas/resourceId'
        ledgerIdentifier:
          $ref: '#/components/schemas/ledgerAssetIdentifier'
        fromSegregatedAccount:
          $ref: '#/components/schemas/finIdAccount'
        fromSegregatedAccountOwner:
          description: 'owner of the pre-funded pool account — the Transfer seller (debited party) for receipts and regulation. Required when fromSegregatedAccount is set.'
          $ref: '#/components/schemas/resourceId'
    moveAsset:
      type: object
      description: 'asset-level migration path declared by the source asset''s organization; source + one-or-more destination assets (no quantity). Optional sourceToSegregatedAccount receives held source tokens on release (instead of burning); each destination may carry a pre-funded fromSegregatedAccount pool for the hold-transfer-* variants. The executor picks one destination at execution.'
      required: [sourceAsset, destinationAssets]
      properties:
        sourceAsset:
          $ref: '#/components/schemas/finp2pAsset'
        destinationAssets:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/moveDestination'
        sourceToSegregatedAccount:
          $ref: '#/components/schemas/finIdAccount'
    requestForTransferIntent:
      type: object
      required: [type, sender, receiver, asset]
      properties:
        type:
          type: string
          enum: [requestForTransferIntent]
        sender:
          $ref: '#/components/schemas/ownerId'
        receiver:
          $ref: '#/components/schemas/ownerId'
        asset:
          $ref: '#/components/schemas/requestForTransferIntentAsset'
        signaturePolicy:
          oneOf:
            - $ref: '#/components/schemas/presignedSignaturePolicy'
            - $ref: '#/components/schemas/manualSignaturePolicy'
          discriminator:
            propertyName: type
            mapping:
              presignedPolicy: '#/components/schemas/presignedSignaturePolicy'
              manualPolicy: '#/components/schemas/manualSignaturePolicy'
    requestForTransferIntentAsset:
      type: object
      required: [assetInstruction, assetTerm]
      properties:
        assetTerm:
          $ref: '#/components/schemas/assetTerm'
        assetInstruction:
          $ref: '#/components/schemas/requestForTransferIntentAssetInstruction'
    # Terms and instructions
    sellingAsset:
      type: object
      required: [assetInstruction, assetTerm]
      properties:
        assetTerm:
          $ref: '#/components/schemas/assetTerm'
        assetInstruction:
          $ref: '#/components/schemas/sourceAccountAssetInstruction'
    buyingAsset:
      type: object
      required: [assetInstruction, assetTerm]
      properties:
        assetTerm:
          $ref: '#/components/schemas/assetTerm'
        assetInstruction:
          $ref: '#/components/schemas/destinationAccountAssetInstruction'
    issuingAsset:
      type: object
      required: [assetInstruction, assetTerm]
      properties:
        assetTerm:
          $ref: '#/components/schemas/assetTerm'
        assetInstruction:
          $ref: '#/components/schemas/sourceOnlyAssetDestinationAccountLedgerAssetInstruction'
    redemptionAsset:
      type: object
      required: [assetInstruction, assetTerm]
      properties:
        assetTerm:
          $ref: '#/components/schemas/assetTerm'
        assetInstruction:
          $ref: '#/components/schemas/optionalDestinationAccountAssetInstruction'
    loanIntentAsset:
      type: object
      required: [assetInstruction, assetTerm]
      properties:
        assetTerm:
          $ref: '#/components/schemas/assetTerm'
        assetInstruction:
          $ref: '#/components/schemas/borrowerLenderAccountAssetInstruction'
    loanExecuteAsset:
      type: object
      required: [assetInstruction, assetTerm]
      properties:
        assetTerm:
          $ref: '#/components/schemas/assetTerm'
        assetInstruction:
          $ref: '#/components/schemas/BorrowerLenderAccountLedgerAssetInstruction'
    sourceDestinationIntentAsset:
      type: object
      properties:
        term:
          $ref: '#/components/schemas/assetTerm'
        instruction:
          $ref: '#/components/schemas/sourceDestinationAccountAssetInstruction'
    sourceDestinationExecuteAsset:
      type: object
      properties:
        term:
          $ref: '#/components/schemas/assetTerm'
        instruction:
          $ref: '#/components/schemas/sourceDestinationAccountLedgerAssetInstruction'
    moveExecuteAsset:
      type: object
      description: >-
        Execution-side asset of a Move: source/destination accounts plus the optional segregated-account legs that select the Move variant (a source segregated account implies Release; a destination pool implies Transfer).
      properties:
        term:
          $ref: '#/components/schemas/assetTerm'
        instruction:
          $ref: '#/components/schemas/sourceDestinationAccountLedgerAssetInstruction'
        sourceToSegregatedAccount:
          $ref: '#/components/schemas/ledgerAccountAsset'
        destinationFromSegregatedAccount:
          $ref: '#/components/schemas/ledgerAccountAsset'
    privateOfferIntentAsset:
      type: object
      required: [assetInstruction, assetTerm]
      properties:
        assetTerm:
          $ref: '#/components/schemas/assetTerm'
        assetInstruction:
          $ref: '#/components/schemas/optionalSourceAccountAssetInstruction'
    sellingSettlements:
      type: array
      minItems: 1
      items:
        $ref: '#/components/schemas/sellingSettlementBase'
    sellingSettlementBase:
      type: object
      required: [settlementTerm]
      properties:
        settlementTerm:
          $ref: '#/components/schemas/settlementTerm'
        settlementInstruction:
          $ref: '#/components/schemas/destinationAccountAssetInstruction'
    buyingSettlements:
      type: array
      minItems: 1
      items:
        $ref: '#/components/schemas/buyingSettlementBase'
    buyingSettlementBase:
      type: object
      required: [settlementTerm]
      properties:
        settlementTerm:
          $ref: '#/components/schemas/settlementTerm'
        settlementInstruction:
          $ref: '#/components/schemas/sourceAccountAssetInstruction'
    loanIntentSettlements:
      type: array
      minItems: 1
      items:
        $ref: '#/components/schemas/loanIntentSettlementBase'
    loanIntentSettlementBase:
      type: object
      required: [settlementTerm]
      properties:
        settlementTerm:
          $ref: '#/components/schemas/settlementTerm'
        settlementInstruction:
          $ref: '#/components/schemas/borrowerLenderAccountAssetInstruction'
    settlementTerm:
      type: 'object'
      discriminator:
        propertyName: 'type'
        mapping:
          noSettlement: '#/components/schemas/noSettlementOption'
          partialSettlement: '#/components/schemas/partialSettlementOption'
          fullSettlement: '#/components/schemas/fullSettlementOption'
      oneOf:
        - $ref: '#/components/schemas/noSettlementOption'
        - $ref: '#/components/schemas/partialSettlementOption'
        - $ref: '#/components/schemas/fullSettlementOption'
    partialSettlementOption:
      type: 'object'
      required: ['type', 'unitValue']
      properties:
        type:
          type: 'string'
          enum: ['partialSettlement']
        unitValue:
          $ref: '#/components/schemas/unitValue'
    fullSettlementOption:
      type: 'object'
      required: ['type', 'amount']
      properties:
        type:
          type: 'string'
          enum: ['fullSettlement']
        amount:
          $ref: '#/components/schemas/amount'
    noSettlementOption:
      type: 'object'
      required: ['type']
      properties:
        type:
          type: 'string'
          enum: ['noSettlement']
    assetTerm:
      type: object
      required: [amount]
      properties:
        amount:
          $ref: '#/components/schemas/amount'
    sourceAccountAssetInstruction:
      type: object
      required: [sourceAccount]
      properties:
        sourceAccount:
          $ref: '#/components/schemas/finp2pAssetAccount'
    destinationAccountAssetInstruction:
      type: object
      required: [destinationAccount]
      properties:
        destinationAccount:
          $ref: '#/components/schemas/finp2pAssetAccount'
    sourceDestinationAccountAssetInstruction:
      type: object
      required: [sourceAccount, destinationAccount]
      properties:
        sourceAccount:
          $ref: '#/components/schemas/finp2pAssetAccount'
        destinationAccount:
          $ref: '#/components/schemas/finp2pAssetAccount'
    sourceDestinationAccountLedgerAssetInstruction:
      type: object
      required: [sourceAccount, destinationAccount]
      properties:
        sourceAccount:
          $ref: '#/components/schemas/finp2pAssetAccount'
        destinationAccount:
          $ref: '#/components/schemas/finp2pAssetAccount'
    sourceOnlyAssetDestinationAccountLedgerAssetInstruction:
      type: object
      required: [sourceAccount, destinationAccount]
      properties:
        sourceAccount:
          $ref: '#/components/schemas/finp2pAssetWithNoAccount'
        destinationAccount:
          $ref: '#/components/schemas/finp2pAssetAccount'
    optionalSourceAccountAssetInstruction:
      type: object
      required: [sourceAccount]
      properties:
        sourceAccount:
          $ref: '#/components/schemas/finp2pAssetAccountOptional'
    optionalDestinationAccountAssetInstruction:
      type: object
      required: [destinationAccount]
      properties:
        destinationAccount:
          $ref: '#/components/schemas/finp2pAssetAccountOptional'
    borrowerLenderAccountAssetInstruction:
      type: object
      required: [borrowerAccount, lenderAccount]
      properties:
        borrowerAccount:
          $ref: '#/components/schemas/finp2pAssetAccount'
        lenderAccount:
          $ref: '#/components/schemas/finp2pAssetAccount'
    BorrowerLenderAccountLedgerAssetInstruction:
      type: object
      required: [borrowerAccount, lenderAccount]
      properties:
        borrowerAccount:
          $ref: '#/components/schemas/finp2pAssetAccount'
        lenderAccount:
          $ref: '#/components/schemas/finp2pAssetAccount'
    requestForTransferIntentAssetInstruction:
      oneOf:
        - $ref: '#/components/schemas/requestForTransferSendAssetInstruction'
        - $ref: '#/components/schemas/requestForTransferRequestAssetInstruction'
      discriminator:
        propertyName: action
        mapping:
          send: '#/components/schemas/requestForTransferSendAssetInstruction'
          request: '#/components/schemas/requestForTransferRequestAssetInstruction'
    requestForTransferSendAssetInstruction:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [send]
          description: Indicates whether the operation is to send or request money/asset.
        senderAccount:
          $ref: '#/components/schemas/finp2pAssetAccount'
    requestForTransferRequestAssetInstruction:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [request]
          description: Indicates whether the operation is to send or request money/asset.
        receiverAccount:
          $ref: '#/components/schemas/finp2pAssetAccount'
    withdrawInstruction:
      type: object
      description: Withdrawal instruction
      required: [account, description]
      properties:
        account:
          $ref: '#/components/schemas/accountAsset'
        description:
          type: string
          description: Instruction details
          pattern: .*\S.*
          x-autoMinLength: true
    intentTypesAllowEmpty:
      type: array
      description: Allowed intent types to be applied on an asset
      items:
        $ref: '#/components/schemas/intentType'
      uniqueItems: true
    accountAsset:
      type: object
      description: 'describes account information'
      required: [account, asset]
      properties:
        account:
          $ref: '#/components/schemas/finIdAccount'
        asset:
          $ref: '#/components/schemas/finp2pAssetBase'
    depositAccount:
      type: object
      description: 'describes account information'
      required: [account, asset]
      properties:
        account:
          type: object
          oneOf:
            - $ref: '#/components/schemas/finIdAccount'
          discriminator:
            propertyName: type
            mapping:
              finId: '#/components/schemas/finIdAccount'
        asset:
          $ref: '#/components/schemas/depositAsset'
    depositAsset:
      type: object
      discriminator:
        propertyName: type
        mapping:
          finp2p: '#/components/schemas/finp2pAssetWithType'
          custom: '#/components/schemas/customAsset'
      oneOf:
        - $ref: '#/components/schemas/finp2pAssetWithType'
        - $ref: '#/components/schemas/customAsset'
    customAsset:
      type: object
      required: [type]
      properties:
        type:
          type: 'string'
          enum: ['custom']
    withdrawAccount:
      type: object
      description: 'describes account information'
      required: [account, asset]
      properties:
        account:
          type: object
          oneOf:
            - $ref: '#/components/schemas/finIdAccount'
          discriminator:
            propertyName: type
            mapping:
              finId: '#/components/schemas/finIdAccount'
        asset:
          $ref: '#/components/schemas/finp2pAssetBase'
    finp2pAssetBase:
      type: object
      required: [resourceId]
      properties:
        resourceId:
          type: 'string'
          pattern: '^[^:](?:.+):102:(?:.+)'
          description: 'unique resource ID of the FinP2P asset'
    finp2pAssetWithType:
      type: object
      required: [type, resourceId]
      properties:
        type:
          type: 'string'
          enum: ['finp2p']
        resourceId:
          type: 'string'
          pattern: '^[^:](?:.+):102:(?:.+)'
          description: 'unique resource ID of the FinP2P asset'
    amount:
      type: string
      description: 'the total number of units'
      pattern: '^\d+\.?\d*$'
      maxLength: 150
    # Conditions
    redemptionIntentConditions:
      properties:
        redemptionDuration:
          type: string
          format: duration
          description: duration in ISO 8601 format (e.g., "PT1H30M" for 1 hour 30 minutes)
          pattern: '^P(\d{1}Y)?(\d{1,2}M)?(\d{1,3}D)?(T(\d{1,2}H)?(\d{1,2}M)?(\d{1,2}S)?)?$'
    loanConditions:
      type: object
      oneOf:
        - $ref: '#/components/schemas/repaymentTerm'
        - $ref: '#/components/schemas/interestTerm'
        - $ref: '#/components/schemas/closeAmountTerm'
      discriminator:
        propertyName: type
        mapping:
          repaymentTerm: '#/components/schemas/repaymentTerm'
          interestTerm: '#/components/schemas/interestTerm'
          closeAmountTerm: '#/components/schemas/closeAmountTerm'
    repaymentTerm:
      type: object
      required: [type, closeAmount]
      properties:
        type:
          type: string
          enum: [repaymentTerm]
        closeAmount:
          $ref: '#/components/schemas/amount'
        interestRate:
          type: string
          description: indicative annual interest rate of the operation
          pattern: '^-?\d*\.?\d*$'
          maxLength: 150
          minLength: 1
          x-autoMinLength: true
    interestTerm:
      type: object
      required: [type, interestRate]
      properties:
        type:
          type: string
          enum: [interestTerm]
        interestRate:
          type: string
          description: indicative annual interest rate of the operation
          pattern: .*\S.*
          x-autoMinLength: true
    closeAmountTerm:
      type: object
      required: [type, closeAmount]
      properties:
        type:
          type: string
          enum: [closeAmountTerm]
        closeAmount:
          $ref: '#/components/schemas/amount'
    loanInstruction:
      type: object
      required: [openDate, closeDate, conditions]
      properties:
        openDate:
          type: integer
          format: int64
          description: date and time operation starts, in epoch (seconds)
          minimum: 0
          # maximum: 10000000000
          x-go-type-skip-optional-pointer: true
        closeDate:
          type: integer
          format: int64
          description: date and time operation ends, in epoch (seconds)
          minimum: 0
          # maximum: 10000000000
          x-go-type-skip-optional-pointer: true
        conditions:
          $ref: '#/components/schemas/loanConditions'
    # Policy types
    presignedSignaturePolicy:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: ['presignedPolicy']
    manualSignaturePolicy:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: ['manualPolicy']
        nonce:
          $ref: '#/components/schemas/nonce'
    unitValue:
      type: 'string'
      description: 'A unit value represented as a string, the value is a decimal number'
      pattern: '^\d+(\.\d+)?$'
    # --- Execution plan model (moved from operational-api.base.yaml) ---
    # Shared because BOTH the operational API (GET /execution/{planId}) and the
    # application API (POST /tokens/execute/dryRun) return an execution plan.
    # It lives here so the application spec never has to depend on the operational
    # spec; this file has no .gen variant, so the empty-string enforcer maintains
    # its string constraints in place.
    EIP712Domain:
      type: object
      properties:
        name:
          type: string
          x-allowEmpty: true
        version:
          type: string
          x-allowEmpty: true
        chainId:
          type: integer
          format: uint64
        verifyingContract:
          type: string
          format: address
          x-allowEmpty: true
    EIP712FieldDefinition:
      type: object
      properties:
        name:
          type: string
          x-allowEmpty: true
        type:
          type: string
          pattern: .*\S.*
          x-autoMinLength: true
    EIP712Template:
      required: [type, domain, message, primaryType, types, hash]
      type: object
      properties:
        type:
          type: string
          enum: ["EIP712"]
        templateVersion:
          type: integer
          minimum: 1
          description: |
            Template shape version. When omitted, the verifier resolves the
            version from the router/ledger/asset-profile resolver chain.
            Not to be confused with EIP712Domain.version (the EIP-712
            contract domain version). See pkg/signature/specs/eip712/ for
            versioned specs.
        domain:
          $ref: '#/components/schemas/EIP712Domain'
        message:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/EIP712TypedValue'
        types:
          $ref: '#/components/schemas/EIP712Types'
        primaryType:
          type: string
          x-allowEmpty: true
        hash:
          type: string
          description: 'hex representation of template hash'
          x-allowEmpty: true
    EIP712TypeArray:
      type: array
      items:
        $ref: '#/components/schemas/EIP712TypedValue'
    EIP712TypeBool:
      type: boolean
    EIP712TypeByte:
      type: string
      pattern: '^0x[0-9a-fA-F]+$' # matches hexadecimal string starting with '0x'
      minLength: 3
      maxLength: 320
    EIP712TypeDefinition:
      type: object
      properties:
        name:
          type: string
          x-allowEmpty: true
        fields:
          type: array
          items:
            $ref: '#/components/schemas/EIP712FieldDefinition'
    EIP712TypeInteger:
      type: integer
    EIP712TypeObject:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/EIP712TypedValue'
    EIP712TypeString:
      type: string
      pattern: '^(?:$|0([^x].*)?|[^0].*)$' # matches string that doesn't start with hexadecimal prefix
      x-allowEmpty: true
    EIP712TypedValue:
      oneOf:
        - $ref: '#/components/schemas/EIP712TypeString'
        - $ref: '#/components/schemas/EIP712TypeInteger'
        - $ref: '#/components/schemas/EIP712TypeBool'
        - $ref: '#/components/schemas/EIP712TypeByte'
        - $ref: '#/components/schemas/EIP712TypeObject'
        - $ref: '#/components/schemas/EIP712TypeArray'
    EIP712Types:
      type: object
      properties:
        definitions:
          type: array
          items:
            $ref: '#/components/schemas/EIP712TypeDefinition'
    assetIntent:
      type: object
      required: [start, end, intent]
      properties:
        start:
          type: integer
          format: int64
          description: start time for intent, in epoch (seconds)
        end:
          type: integer
          format: int64
          description: end time for intent, in epoch (seconds)
        intent:
          $ref: '#/components/schemas/intent'
    awaitInstruction:
      type: object
      required: [type, waitUntil]
      properties:
        type:
          type: string
          enum: ["await"]
        waitUntil:
          type: integer
          format: uint64
    buyingContractDetails:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [buying]
        asset:
          $ref: '#/components/schemas/sourceDestinationExecuteAsset'
        settlement:
          $ref: '#/components/schemas/sourceDestinationExecuteAsset'
        selectedSettlement:
          type: object
          required: [legs]
          properties:
            legs:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/sourceDestinationExecuteAsset'
    contract:
      type: object
      properties:
        investors:
          type: array
          items:
            $ref: '#/components/schemas/investor'
        contractDetails:
          oneOf:
            - $ref: '#/components/schemas/issuanceContractDetails'
            - $ref: '#/components/schemas/buyingContractDetails'
            - $ref: '#/components/schemas/sellingContractDetails'
            - $ref: '#/components/schemas/loanContractDetails'
            - $ref: '#/components/schemas/transferContractDetails'
            - $ref: '#/components/schemas/redeemContractDetails'
            - $ref: '#/components/schemas/privateOfferContractDetails'
            - $ref: '#/components/schemas/requestForTransferContractDetails'
            - $ref: '#/components/schemas/moveContractDetails'
          discriminator:
            propertyName: type
            mapping:
              issuance: '#/components/schemas/issuanceContractDetails'
              buying: '#/components/schemas/buyingContractDetails'
              selling: '#/components/schemas/sellingContractDetails'
              loan: '#/components/schemas/loanContractDetails'
              transfer: '#/components/schemas/transferContractDetails'
              redeem: '#/components/schemas/redeemContractDetails'
              privateOffer: '#/components/schemas/privateOfferContractDetails'
              requestForTransfer: '#/components/schemas/requestForTransferContractDetails'
              move: '#/components/schemas/moveContractDetails'
    executionInstruction:
      type: object
      required: [sequence, organizations, executionPlanOperation]
      properties:
        sequence:
          type: integer
          format: uint32
        organizations:
          type: array
          items:
            type: string
            pattern: .*\S.*
            x-autoMinLength: true
        executionPlanOperation:
          $ref: '#/components/schemas/executionPlanOperation'
        timeout:
          type: integer
          format: int32
    executionParticipant:
      type: object
      required: [organizationId, roles]
      properties:
        organizationId:
          type: string
          pattern: .*\S.*
          x-autoMinLength: true
        roles:
          type: array
          items:
            type: string
            enum: ["contributor", "observer"]
    executionPlan:
      type: object
      required: [id, intent, instructions, participants, contract]
      properties:
        id:
          $ref: '#/components/schemas/executionPlanId'
        intent:
          $ref: '#/components/schemas/assetIntent'
        instructions:
          type: array
          items:
            $ref: '#/components/schemas/executionInstruction'
        participants:
          type: array
          items:
            $ref: '#/components/schemas/executionParticipant'
        contract:
          $ref: '#/components/schemas/contract'
        metadata:
          $ref: '#/components/schemas/customMetadata'
    executionPlanId:
      type: string
      description: 'The execution plan  resource id'
      pattern: '^[^:](?:.+):106:(?:.+)'
      example: 'bank-x:106:511c1d7f-4ed8-410d-887c-a10e3e499a01'
    executionPlanOperation:
      oneOf:
        - $ref: '#/components/schemas/holdInstruction'
        - $ref: '#/components/schemas/releaseInstruction'
        - $ref: '#/components/schemas/issueInstruction'
        - $ref: '#/components/schemas/transferInstruction'
        - $ref: '#/components/schemas/awaitInstruction'
        - $ref: '#/components/schemas/revertHoldInstruction'
        - $ref: '#/components/schemas/redemptionInstruction'
      discriminator:
        propertyName: type
        mapping:
          hold: '#/components/schemas/holdInstruction'
          release: '#/components/schemas/releaseInstruction'
          issue: '#/components/schemas/issueInstruction'
          transfer: '#/components/schemas/transferInstruction'
          await: '#/components/schemas/awaitInstruction'
          redeem: '#/components/schemas/redemptionInstruction'
    field:
      type: object
      description: 'describing a field in the hash group'
      required: [name, type, value]
      properties:
        name:
          type: string
          description: 'name of field'
          pattern: .*\S.*
          x-autoMinLength: true
        type:
          type: string
          enum: ["string", "int", "bytes"]
          description: 'type of field'
        value:
          type: string
          description: 'hex representation of the field value'
          x-allowEmpty: true
    hashFunction:
      type: string
      enum:
        - unspecified
        - sha3_256
        - sha3-256
        - blake2b
        - keccak_256
        - keccak-256
      description: hash function types
    hashGroup:
      type: object
      required: [hash, fields]
      properties:
        hash:
          type: string
          description: 'hex representation of the hash group hash value'
          x-allowEmpty: true
        fields:
          description: 'list of fields by order they appear in the hash group'
          type: array
          items:
            $ref: '#/components/schemas/field'
    hashListTemplate:
      description: 'ordered list of hash groups'
      required: [type, hashGroups, hash]
      type: object
      properties:
        type:
          type: string
          enum: ["hashList"]
        templateVersion:
          type: integer
          minimum: 1
          description: |
            This version identifies the HashList template specification revision.
            When omitted, the verifier resolves the version from the
            router/ledger/asset-profile resolver chain.
        hashGroups:
          type: array
          items:
            $ref: '#/components/schemas/hashGroup'
        hash:
          type: string
          description: 'hex representation of the combined hash groups hash value'
          x-allowEmpty: true
    holdInstruction:
      type: object
      required: [type, source, destination, asset, amount, signature]
      properties:
        type:
          type: string
          enum: ["hold"]
        source:
          $ref: '#/components/schemas/ledgerAccountAsset'
        destination:
          $ref: '#/components/schemas/ledgerAccountAsset'
        amount:
          type: string
          pattern: .*\S.*
          x-autoMinLength: true
        signature:
          $ref: '#/components/schemas/signature'
    investor:
      type: object
      properties:
        investor:
          type: string
          pattern: .*\S.*
          x-autoMinLength: true
        role:
          type: string
          enum: ["buyer", "seller", "lender", "borrower", "issuer"]
        signature:
          $ref: '#/components/schemas/signature'
    issuanceContractDetails:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [issuance]
        asset:
          $ref: '#/components/schemas/sourceDestinationExecuteAsset'
        settlement:
          $ref: '#/components/schemas/sourceDestinationExecuteAsset'
    issueInstruction:
      type: object
      required: [type, destination, amount, signature]
      properties:
        type:
          type: string
          enum: ["issue"]
        destination:
          $ref: '#/components/schemas/ledgerAccountAsset'
        amount:
          type: string
          pattern: .*\S.*
          x-autoMinLength: true
        signature:
          $ref: '#/components/schemas/signature'
    loanContractDetails:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [loan]
        asset:
          $ref: '#/components/schemas/loanExecuteAsset'
        settlement:
          $ref: '#/components/schemas/loanExecuteAsset'
        instruction:
          $ref: '#/components/schemas/loanInstruction'
    moveContractDetails:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [move]
        asset:
          $ref: '#/components/schemas/moveExecuteAsset'
    privateOfferContractDetails:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [privateOffer]
        asset:
          $ref: '#/components/schemas/sourceDestinationExecuteAsset'
        settlement:
          $ref: '#/components/schemas/sourceDestinationExecuteAsset'
        selectedSettlement:
          type: object
          required: [legs]
          properties:
            legs:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/sourceDestinationExecuteAsset'
    redeemContractDetails:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [redeem]
        asset:
          $ref: '#/components/schemas/sourceDestinationExecuteAsset'
        settlement:
          $ref: '#/components/schemas/sourceDestinationExecuteAsset'
    redemptionInstruction:
      type: object
      required: [type, source, destination, amount, signature]
      properties:
        type:
          type: string
          enum: ["redemption"]
        source:
          $ref: '#/components/schemas/ledgerAccountAsset'
        destination:
          $ref: '#/components/schemas/ledgerAccountAsset'
        amount:
          type: string
          pattern: .*\S.*
          x-autoMinLength: true
        signature:
          $ref: '#/components/schemas/signature'
    releaseInstruction:
      type: object
      required: [type, source, destination, asset, amount]
      properties:
        type:
          type: string
          enum: ["release"]
        source:
          $ref: '#/components/schemas/ledgerAccountAsset'
        destination:
          $ref: '#/components/schemas/ledgerAccountAsset'
        amount:
          type: string
          pattern: .*\S.*
          x-autoMinLength: true
    requestForTransferContractDetails:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [requestForTransfer]
        asset:
          $ref: '#/components/schemas/sourceDestinationExecuteAsset'
    revertHoldInstruction:
      type: object
      required: [type, destination]
      properties:
        type:
          type: string
          enum: ["revert-hold"]
        source:
          $ref: '#/components/schemas/ledgerAccountAsset'
        destination:
          $ref: '#/components/schemas/ledgerAccountAsset'
    sellingContractDetails:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [selling]
        asset:
          $ref: '#/components/schemas/sourceDestinationExecuteAsset'
        settlement:
          $ref: '#/components/schemas/sourceDestinationExecuteAsset'
        selectedSettlement:
          type: object
          required: [legs]
          properties:
            legs:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/sourceDestinationExecuteAsset'
    signature:
      type: object
      required: [signature, template, hashFunc]
      description: 'represent a signature template information'
      properties:
        signature:
          type: string
          description: 'hex representation of the signature'
          pattern: .*\S.*
          x-autoMinLength: true
        template:
          $ref: '#/components/schemas/signatureTemplate'
        hashFunc:
          $ref: '#/components/schemas/hashFunction'
    signatureTemplate:
      type: object
      oneOf:
        - $ref: '#/components/schemas/hashListTemplate'
        - $ref: '#/components/schemas/EIP712Template'
      discriminator:
        propertyName: type
        mapping:
          hashList: '#/components/schemas/hashListTemplate'
          EIP712: '#/components/schemas/EIP712Template'
    transferContractDetails:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [transfer]
        asset:
          $ref: '#/components/schemas/sourceDestinationExecuteAsset'
    transferInstruction:
      type: object
      required: [type, source, destination, amount, signature]
      properties:
        type:
          type: string
          enum: ["transfer"]
        source:
          $ref: '#/components/schemas/ledgerAccountAsset'
        destination:
          $ref: '#/components/schemas/ledgerAccountAsset'
        amount:
          type: string
          pattern: .*\S.*
          x-autoMinLength: true
        signature:
          $ref: '#/components/schemas/signature'
