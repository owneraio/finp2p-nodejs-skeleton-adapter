"The query root of Ownera's GraphQL interface."
type Query {
    "Look up Assets, Optional provide Filters or Aggregates."
    assets(filter: [Filter!], where: FilterExpr, aggregate: [Aggregate!], paginate: PaginateInput = {}, orderBy: AssetOrderInput): Assets!

    "Look up Users, Optional provide Filter or Aggregate."
    users(filter: [Filter!], where: FilterExpr, aggregate: [Aggregate!], paginate: PaginateInput = {}, orderBy: UserOrder): Users!

    "Look up Receipts, Optional provide Filter."
    receipts(filter: [Filter], where: FilterExpr, paginate: PaginateInput = {}, orderBy: ReceiptOrder): Receipts!

    "Look up Issuers, Optional provide Filter."
    issuers(filter: [Filter!], where: FilterExpr, paginate: PaginateInput = {}, orderBy: IssuerOrder): Issuers!

    "Look up Certificates, Optional provide Filter or Aggregate."
    certificates(filter: [Filter!], where: FilterExpr, aggregate: [Aggregate!], paginate: PaginateInput = {}, orderBy: CertificateOrder): Certificates!

    "Look up Organizations, Optional provide Filter or Aggregate."
    organizations(filter: [Filter!], where: FilterExpr, aggregate: [Aggregate!], paginate: PaginateInput = {}, orderBy: OrganizationOrder): Organizations!

    "Look up Execution Plans, Optional provide Filter."
    plans(filter:[Filter!], where: FilterExpr, paginate: PaginateInput = {}, orderBy: ExecutionPlanOrder): ExecutionsPlans!

    "Look up Workflows, Optional provide Filter."
    workflows(filter: [Filter!], where: FilterExpr, paginate: PaginateInput = {}, orderBy: WorkflowOrder): Workflows!

    ledgers(filter: [Filter!], where: FilterExpr, paginate: PaginateInput = {}): LedgerBindings!

    custodyProviders(filter: [Filter!], where: FilterExpr, paginate: PaginateInput = {}): CustodyProviders!

    approvalConfigs(paginate: PaginateInput = {}): ApprovalConfigs!

    pinningConfig: PinningConfigs

    "Look up Asset Data, Optional provide Filter."
    assetDatas(filter: [Filter!], where: FilterExpr, paginate: PaginateInput = {}): AssetDatas!

    "Look up Data Provider bindings."
    dataProviders(filter: [Filter!], where: FilterExpr, paginate: PaginateInput = {}): DataProviderBindings!

    "Look up Data Rules that map identifiers to data providers."
    dataRules(filter: [Filter!], where: FilterExpr, paginate: PaginateInput = {}): DataRules!

    "Look up FinancialAssets aggregated by financial identifier (type + value) from data adapter data. Filter by identifierType/identifierValue to get a specific asset."
    financialAssets(filter: [Filter!], where: FilterExpr, paginate: PaginateInput = {}): FinancialAssets!
}

