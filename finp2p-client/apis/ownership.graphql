"Vote to reset an execution plan, tracked by proposal consensus."
type ResetExecutionOperation implements Operation {
    cid: String!
    type: String!
    status: String!
    isCompleted: Boolean!
    isFailed: Boolean!
    error: OperationError
    organizationId: String
    creationTimestamp: Int
    completionTimestamp: Int
    planId: String
    "Same as planId, named to match FinAPI's executionPlanId for client parity."
    executionPlanId: String
    proposalId: String
}

type Operations {
    "Collection of Operation Objects, conforms to the Filter input if provided."
    nodes: [Operation!]
    "Keeps pagination info in-case limit input was provided"
    pageInfo: PageInfo
}

enum OperationOrderField {
    CID
    TYPE
    STATUS
    CREATION_TIMESTAMP
    COMPLETION_TIMESTAMP
}

input OperationOrder {
    field: OperationOrderField
    direction: SortOrder
}

type CustodyAccount {
    publicKey: String!
    providerAccountId: String!
    custodyProvider: String!
}

type CustodyAccounts {
    nodes: [CustodyAccount!]
    pageInfo: PageInfo
}

"Fields to subscribe on"
enum OperationField {
    IsCompleted
    IsFailed
    Status
}

type CustodyProvider {
    name: String!
    endpoint: String!
    displayName: String
    idempotency: LedgerIdempotencyOptions
    requestTimeout: String!
    backoff: String!
    singleRequestTimeout: String!
}

"Identifier type for asset data"
enum AssetDataIdentifierType {
    ISIN
    CAIP19
}

"Financial data types provided by data providers"
enum DataType {
    assetHeader
    pricing
    fundamentals
    ratings
    corporateActions
    marketData
    referenceData
}

"Represents financial data for an asset from a data provider"
type AssetDataItem {
    id: String!
    "Type of identifier used (ISIN or CAIP19)"
    identifierType: AssetDataIdentifierType!
    "The identifier value (e.g., US0378331005 for ISIN)"
    identifierValue: String!
    "Type of financial data"
    dataType: DataType!
    "The actual data as JSON string"
    data: String!
    "Data provider source identifier"
    source: String
    "Provider timestamp (epoch ms)"
    providerTimestamp: Int
    "When the record was created"
    createdAt: Int!
    "When the record was last updated"
    updatedAt: Int!
}

"Results for asset data query."
type AssetDatas {
    "Collection of AssetDataItem Objects, conforms to the Filter input if provided."
    nodes: [AssetDataItem!]

    "Keeps pagination info in-case limit input was provided"
    pageInfo: PageInfo
}

"Represents a data provider binding configuration"
type DataProviderBinding {
    "Unique identifier (UUID) for the data provider"
    id: ID!
    name: String!
    "Type of data provider: adapter (external HTTP) or finp2p (internal P2P)"
    providerType: String!
    endpoint: String!
    displayName: String
    requestTimeout: String!
    backoff: String!
    "JSON array of data type strings this provider serves"
    dataTypes: [String!]
    "JSON string of per-data-type fetch configuration"
    dataTypeConfig: String
    createdAt: Int!
    updatedAt: Int!
}

"Results for data provider query."
type DataProviderBindings {
    "Collection of DataProviderBinding Objects, conforms to the Filter input if provided."
    nodes: [DataProviderBinding!]

    "Keeps pagination info in-case limit input was provided"
    pageInfo: PageInfo
}

"Aggregated view of a financial asset identified by ISIN"
type FinancialAsset {
    "ISIN identifier value (e.g., US0378331005); empty for non-ISIN financial identifiers. Kept for backward compatibility -- prefer identifierType/identifierValue."
    isin: String!
    "Financial identifier type this asset is aggregated by (e.g., ISIN, ISO4217)"
    identifierType: String!
    "Financial identifier value (e.g., US0378331005 for ISIN, USD for ISO4217)"
    identifierValue: String!
    "Financial data items from data adapters for this financial identifier"
    dataItems(dataTypes: [DataType!]): [AssetDataItem!]!
    "Refresh configurations for this financial identifier"
    refreshConfigs: [AssetRefreshConfigItem!]!
    "CAIP19 identifiers — asset instances on different networks/blockchains (from assetHeader data)"
    caip19Identifiers: [String!]!
    "FinP2P assets linked by matching financial identifier (may be empty)"
    linkedAssets: [Asset!]!
}

"Results for financial asset query."
type FinancialAssets {
    nodes: [FinancialAsset!]
    pageInfo: PageInfo
}

"Refresh configuration for an asset's data from a provider"
type AssetRefreshConfigItem {
    id: String!
    identifierType: AssetDataIdentifierType!
    identifierValue: String!
    dataType: String!
    refreshInterval: String!
    lastRefreshAt: Int
    nextRefreshAt: Int
    "UUID of the data provider"
    providerId: String
    enabled: Boolean!
    createdAt: Int!
    updatedAt: Int!
}

"Represents a data rule mapping an asset identifier to a data provider"
type DataRuleItem {
    id: String!
    "Type of identifier (e.g., ISIN)"
    identifierType: String!
    "The identifier value (e.g., US0378331005)"
    identifierValue: String!
    "UUID of the data provider"
    providerId: String!
    "The data type this rule covers"
    dataType: String!
    "Refresh interval for this rule (e.g., 1h, 24h, RT)"
    refreshInterval: String
    "Whether this rule is active"
    enabled: Boolean!
    "When the rule was created (epoch seconds)"
    createdAt: Int!
    "When the rule was last updated (epoch seconds)"
    updatedAt: Int!
}

"Results for data rules query."
type DataRules {
    "Collection of DataRuleItem Objects, conforms to the Filter input if provided."
    nodes: [DataRuleItem!]

    "Keeps pagination info in-case limit input was provided"
    pageInfo: PageInfo
}

union LedgerReference = ContractDetails

type ContractDetails {
    network: String!
    address: String!
    tokenStandard: String
    additionalContractDetails: AdditionalContractDetails
}

type AdditionalContractDetails {
    finP2PEVMOperatorDetails: FinP2PEVMOperatorDetails
}

type FinP2PEVMOperatorDetails {
    finP2POperatorContractAddress: String!
    allowanceRequired: Boolean!
}

"Regulation Verifier"
type Verifier {
    "Verifier ID"
    id: String

    "Verifier Name"
    name: String

    "Provider type: REG_APP_STORE, OTHER"
    provider: String
}

"Represents an Issuer in the network."
type Issuer  {
    id: String!

    "Assets issued by the Issuer."
    assets(filter : [Filter!], where: FilterExpr, aggregates: [Aggregate!], paginate: PaginateInput = {}): Assets!

    outbox(filter : [Filter!], where: FilterExpr): OutgoingMessages
}

"Represents an User in the network."
type User implements Profile  {
    id: String!

    "Collection of certificates associated with the Profile."
    certificates(filter : [Filter!], where: FilterExpr, aggregates: [Aggregate!]): Certificates!

    name: String!

    holdings(filter : [Filter!], where: FilterExpr, aggregates: [Aggregate!]): Holdings!

    "Organization id to whom this profile is associated with."
    organizationId: String!

    "Profile metadata, contains ACL information of the profile."
    metadata: ProfileMetadata!

    "finIds keys associated with this investor"
    finIds: [String!]

    accounts(filter: [Filter!], where: FilterExpr): [FinP2PAccount!]

    "Investor network accounts (LA-managed wallets) bound to a specific organization and asset."
    networkAccounts(filter: [Filter!], where: FilterExpr): [InvestorNetworkAccount!]

    "User's associated messages"
    #    inbox(filter : [Filter!]): [IncomingMessage!]!
    inbox(filter : [Filter!], where: FilterExpr): Messages!

    "user resource version"
    version: String!

    "Data access permissions this resource has received from other organizations"
    dataAccessReceived: [String]

    "Org-local labels computed by the router; filter via key `labels.<key>`."
    labels: [KeyValuePair!]
}

type OutgoingMessages {
    nodes: [OutgoingMessage!]
}

type Messages {
    nodes: [Message!]
}

type Message {
    id: String!
    subject: String! #Q: is subject and body always relevant for any communication type? (email, SMS, notification)
    body: String!
    # TODO: [IC-P3] improve
    timestamp: String!
    attachments: [Attachment!]! #Q: attachments may not be relevant to different communication types
    correspondent: Correspondent! ## Source as FinID account ?
}

type IncomingMessage {
    message : Message
}


type OutgoingMessage {
    message: Message

    # Message recipients
    recipients(filter : [Filter!]): MessageRecipients!
}

type MessageRecipients {
    "Collection of User Objects, conforms to the Filter input if provided."
    nodes: [MessageRecipient!]
}

union DeliveryStatus =  PendingDelivery | Delivered | NotDelivered

type PendingDelivery {
    _ignore: Boolean
}

type Delivered {
    _ignore: Boolean
}

type NotDelivered {
    # non delivery reason
    status : String!
}

type MessageRecipient {
    destination: Recipient!
    deliveryStatus: DeliveryStatus
}

type Attachment {
    uuid: String!
    name: String
    link: String
    messageId: String!
}


union Correspondent = AssetIssuer
union Recipient  = Investor

type AssetIssuer {
    issuerId: String!
    assetId: String!
}

type Investor {
    resourceId: String!
}

type Holdings {
    "Collection of Funds balance objects, conforms to the Filter input if provided."
    nodes: [Holding!]
    "Collection of Aggregate Results, if an Aggregate input was provided."
    aggregate: [AggregateResult!]
}

type Holding {
    account: FinP2PAccount!
    assetType: AssetType!
    asset: AssetDetails!
    balance: String! ## calculated balance based on asset's receipt
    withheldBalance: String! ## calculated available balance based on asset's receipt
    availableBalance: String! ## calculated held balance based on asset's receipt
    balanceTimestamp: Int! ##  epoch seconds timestamp of last balance synchronization
    syncedBalance: String! ## balance synced from ledger
    syncedAvailableBalance: String! ## available balance synced from ledger
    syncedHeldBalance: String! ## held balance synced from ledger
}

"FinP2P account - represents a user account in the FinP2P network"
type FinP2PAccount {
    "FinId -- a user's public key represented as a hexadecimal string"
    finId: String!
    "Organization id of the account"
    orgId: String!
    "Custodian for the finId"
    custodian: Custodian
    "Account-scoped authorization policy embedded on the account; null for ungoverned accounts"
    accountPolicy: AccountPolicy
}

type Custodian {
    orgId: String!
}

"Represents an Asset token balance information."
type TokenBalance {
    userId: String!

    "Owner's display name; empty when the owner profile carries no name claim."
    userName: String!

    assetId: String!
    quantity: String! ## calculated balance based on asset's receipt
    availableQuantity: String! ## calculated available balance based on asset's receipt
    heldQuantity: String! ## calculated held balance based on asset's receipt
    syncedQuantity: String! ## balance synced from ledger
    syncedAvailableQuantity: String! ## available balance synced from ledger
    syncedHeldQuantity: String! ## held balance synced from ledger
    syncedQuantityTimestamp: Int! ## epoch seconds timestamp of last balance synchronization
    transactionsDetails: [TransactionDetails!]
}

type TransactionDetails {
    transactionId: String!
    index: Int!
    quantity: String!
}

type Receipt {
    id: String!

    "Source owner resource ID"
    source: String

    "Source account of transaction"
    sourceAccount: LedgerAccountAsset

    "Destination owner resource ID"
    destination: String

    "Destination account of transaction"
    destinationAccount: LedgerAccountAsset

    "Number of asset units with the transaction"
    quantity: String!

    "Trade details associated with the transaction"
    tradeDetails: TradeDetails

    "Operation id"
    operationId: String

    "Underlying transaction id"
    transactionId: String

    "Operation type"
    operationType: OperationType

    "Receipt timestamp"
    timestamp: String!

    "Receipt status"
    status: ReceiptStatus!

    "Ledger proof"
    proof: Proof

    "Issuing organization: the org prefix of the receipt leg's asset resource id"
    org: String!

    "Ledger name of the receipt leg's asset, as bound on the issuing org"
    ledger: String!
}

union Proof = NoProof | SignatureProof

type NoProof {
    _ignore: Boolean
}

type SignatureProof {
    signature: Signature!
}

type Signature {
    template: Template!
    signature: String!
    hashFunction: String!
    templateType: templateType!
    "Template shape version. Defaults to 1 when the producer is on a pre-versioning finp2p-core release."
    templateVersion: Int!
}

enum templateType {
    EIP712Template
    HashListTemplate
}

union Template = HashlistTemplate | EIP712Template

type HashlistTemplate {
    hash: String!
    hashGroups: [HashGroup!]!
}

type HashGroup {
    hash: String!
    fields: [Field!]!
}

type Field {
    name: String!
    type: String!
    value: String!
}

type EIP712Template {
    hash: String!
}

enum OperationType {
    Unknown
    Issue
    Transfer
    Release
    Hold
    Redeem
    Move
    Swap
}

type TradeDetails {
    "Intent  associated with the transaction"
    intent: Intent

    "Details of ExecutionPlan associated with the transaction"
    executionContext: ExecutionContext
}

type ExecutionContext {
    "ExecutionPlan associated with the transaction"
    executionPlanId: String

    "The associated instruction sequence number"
    instructionSequenceNumber: Int
}

"Represents a Certificate in the network."
type Certificate {
    id: String!

    "Profile to whom this Certificate is associate with."
    profileId: String!

    "Type of Certificate (KYA,KYC,AML etc.. )."
    type: String!

    "Service Provider Id which provided the Certificate."
    providerId : String!

    issuedAt: Int!
    expiry: Int

    "Semi-Structured Data provided as additional information for the Certificate."
    data: String

    "Certificate associated documents metadata."
    documents(filter : [Filter!], where: FilterExpr): Documents!
}


type KeyValuePair {
    key: String!
    value: String!
}

"Represent an Asset's Transaction Intent occasion in which the Asset's tokens are issued."
type Intent {
    id: String!

    "Start time of the intent."
    start: Int!

    "End time of the intent."
    end: Int!

    "Intent status"
    status: IntentStatus!

    "Remaining quantity in the transaction."
    remainingQuantity: String!

    "Intent type: primary sale, buying or selling intent"
    type: String!

    "Intent data"
    intent: IntentDetails

    "Custom key-value metadata for tracing and reconciliation"
    customMetadata: [KeyValuePair!]

    "Profile metadata, contains ACL information of the profile."
    metadata: ProfileMetadata!

    "intent resource version"
    version: String!

    "Reason the intent was rejected, prefixed with the rejecting organization (owner side only)."
    rejectReason: String
}


enum IntentStatus {
    ACTIVE
    NON_ACTIVE
    CANCELLED
    COMPLETED
    EXPIRED
    REJECTED
}

type AssetTerm {
    "Total amount of asset allocated"
    amount: String!
}


"Account identifier - supports FinP2P, crypto wallets, and IBAN"
union AccountIdentifier = CryptoWalletAccount | Iban | FinP2PAccount

"FinP2P asset account - combines asset info with account info (matches proto FinP2PAssetAccount)"
type FinP2PAssetAccount {
    "FinP2P asset information"
    asset: FinP2PAsset

    "FinP2P account information"
    account: FinP2PAccount
}

"Crypto wallet account"
type CryptoWalletAccount {
    "Wallet address represented as a hexadecimal string prefixed with 0x"
    address: String!
}

"IBAN bank account"
type Iban {
    "IBAN code"
    code: String!
}

"Ledger account asset - combines FinP2P account with optional network account"
type LedgerAccountAsset {
    "FinP2P asset account"
    finp2pAccount: FinP2PAssetAccount!

    "Network account (e.g., wallet)"
    networkAccount: NetworkAccount
}

"Network account — exactly one variant, mirroring the proto NetworkAccount oneof."
union NetworkAccount = WalletAccount | Caip10Account | CustodialAccount

"An investor's LA-managed network account bound to a specific organization and asset."
type InvestorNetworkAccount {
    "Organization that manages this network account."
    organizationId: String!

    "Asset the network account is bound to."
    assetId: String!

    "LA-assigned account identifier."
    id: String!

    "The bound network identity — a union of variants (wallet today; caip10/custodial when projected). Exactly one variant is set."
    account: NetworkAccount
}

"Wallet account for blockchain wallets"
type WalletAccount {
    "Type of wallet (e.g., ethereum)"
    type: String!

    "Wallet address"
    address: String!
}

"CAIP-10 chain-agnostic on-chain account"
type Caip10Account {
    "CAIP-2 chain_id, e.g. eip155:1 (the same token used by the CAIP-19 asset identifier network)"
    network: String!

    "CAIP-10 account address (chain-native address)"
    address: String!
