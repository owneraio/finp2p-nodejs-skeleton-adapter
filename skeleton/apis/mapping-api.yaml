openapi: 3.0.1
info:
  title: Adapter Mapping API
  description: >-
    Operational mapping API for FinP2P adapter identity provisioning.
    Associates FinP2P investor identities (finId) with ledger-specific
    account identifiers.
  termsOfService: 'https://ownera.io/terms/'
  contact:
    email: support@ownera.io
  version: 0.1.0
tags:
  - name: mapping
    description: Owner identity mapping operations

paths:
  /mapping/owners:
    post:
      tags:
        - mapping
      summary: Create or update owner mapping
      description: >-
        Associate a FinP2P finId with a ledger-specific account identifier.
        Also provisions an on-ledger credential when possible.
      operationId: createOwnerMapping
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createOwnerMappingRequest'
      responses:
        '200':
          description: Mapping created or updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createOwnerMappingResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'

    get:
      tags:
        - mapping
      summary: Query owner mappings
      description: Retrieve provisioned owner mappings, optionally filtered by finId list.
      operationId: getOwnerMappings
      parameters:
        - name: finIds
          in: query
          required: false
          description: Comma-separated list of finIds to filter by
          schema:
            type: string
      responses:
        '200':
          description: List of owner mappings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ownerMapping'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'

  /mapping/fields:
    get:
      tags:
        - mapping
      summary: Get supported account mapping fields
      description: Returns metadata describing the structure of account mapping fields.
      operationId: getMappingFields
      responses:
        '200':
          description: List of account mapping field descriptors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/accountMappingField'

  /investor/whitelist:
    post:
      summary: Whitelist a party for an asset
      description: |
        Adapter-internal. Records that the party is permitted to transact the
        given `assetId`, together with an arbitrary adapter-defined `config`.
        Supply exactly one of `finId` or `address` — an escrow custody wallet has
        no finId, and cleaning up a replaced mapping leaves only an address.
        Re-whitelisting the same (party, asset) replaces the stored config.

        Requires `Authorization: Bearer <token>` when the adapter registered these
        routes with a token. This is a privileged surface: see the security note
        on the DELETE operation.
      operationId: whitelistInvestor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/whitelistInvestorRequest'
      responses:
        '200':
          description: party whitelisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/investorWhitelistEntry'
        '400':
          description: invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
        '401':
          description: missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
        '409':
          description: |
            Refused on policy grounds — the party stays blocked by mechanisms this
            deployment does not operate, so onboarding must be completed
            elsewhere. Distinct from 500, which means the adapter failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/whitelistRefusedResponse'
        '429':
          description: too many failed authorization attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
        '500':
          description: server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
    delete:
      summary: Dewhitelist a party
      description: |
        Adapter-internal. Removes the party's whitelist entry. Omit `assetId` to
        remove every entry for the party. Removing an entry that does not exist is
        a success, so retries are safe.

        **Security.** This revokes access. Omitting `assetId` revokes the party
        for every asset in one call, using whatever authority the adapter holds.
        Register these routes with a token, or keep them behind a trusted network
        boundary.
      operationId: dewhitelistInvestor
      parameters:
        - in: query
          name: finId
          required: false
          schema:
            type: string
          description: FinP2P identity. Supply exactly one of finId or address.
        - in: query
          name: address
          required: false
          schema:
            type: string
          description: Raw ledger address. Supply exactly one of finId or address.
        - in: query
          name: assetId
          required: false
          schema:
            type: string
          description: Asset resource id. Omit to remove all entries for the party.
      responses:
        '200':
          description: entries removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dewhitelistInvestorResponse'
        '400':
          description: invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
        '401':
          description: missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
        '409':
          description: refused on policy grounds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/whitelistRefusedResponse'
        '429':
          description: too many failed authorization attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
        '500':
          description: server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
    get:
      summary: Query whitelist entries
      description: |
        Adapter-internal. Optional `finId` / `address` and `assetId` filters.

        An implementation backed by ledger enforcement may not be able to report
        the `config` originally submitted — only what the ledger can tell it.
      operationId: getInvestorWhitelist
      parameters:
        - in: query
          name: finId
          required: false
          schema:
            type: string
        - in: query
          name: address
          required: false
          schema:
            type: string
        - in: query
          name: assetId
          required: false
          schema:
            type: string
      responses:
        '200':
          description: whitelist entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/investorWhitelistEntry'
        '401':
          description: missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
        '429':
          description: too many failed authorization attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
        '500':
          description: server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'

components:
  schemas:
    ownerStatus:
      type: string
      enum:
        - active
        - inactive

    accountMappings:
      type: object
      additionalProperties:
        type: string
      description: >-
        Key-value pairs of adapter-specific account identifiers
        (e.g. ledgerAccountId, custodyAccountId)

    ownerMapping:
      type: object
      required:
        - finId
        - status
        - accountMappings
      properties:
        finId:
          type: string
          description: FinP2P identity (hex secp256k1 compressed public key)
        status:
          $ref: '#/components/schemas/ownerStatus'
        accountMappings:
          $ref: '#/components/schemas/accountMappings'

    createOwnerMappingRequest:
      type: object
      required:
        - finId
        - accountMappings
      properties:
        finId:
          type: string
          description: FinP2P identity (hex secp256k1 compressed public key)
        status:
          $ref: '#/components/schemas/ownerStatus'
        accountMappings:
          $ref: '#/components/schemas/accountMappings'

    createOwnerMappingResponse:
      allOf:
        - $ref: '#/components/schemas/ownerMapping'
        - type: object
          properties:
            credentialCid:
              type: string
              description: Contract ID of the on-ledger FinID credential (or "none")
            credentialStatus:
              type: string
              description: >-
                Status of on-ledger credential provisioning
                (e.g. "created", "existing", "skipped")

    accountMappingField:
      type: object
      required:
        - field
        - description
        - exampleValue
      properties:
        field:
          type: string
          description: The field name within accountMappings
        description:
          type: string
          description: Human-readable description of the field
        exampleValue:
          type: string
          description: Example value for the field

    whitelistConfig:
      type: object
      additionalProperties: true
      description: |
        Arbitrary adapter-defined configuration for the whitelist entry, stored
        verbatim. The skeleton does not interpret it — validate it with a
        InvestorWhitelistValidator if the adapter needs to.
    whitelistInvestorRequest:
      type: object
      required:
        - assetId
      properties:
        finId:
          type: string
          description: FinP2P identity (hex secp256k1 compressed public key). Supply exactly one of finId or address.
        address:
          type: string
          description: Raw ledger address, for parties with no finId (e.g. an escrow custody wallet). Supply exactly one of finId or address.
        assetId:
          type: string
          description: Asset resource id
        config:
          $ref: '#/components/schemas/whitelistConfig'
    investorWhitelistEntry:
      type: object
      required:
        - assetId
        - config
      properties:
        finId:
          type: string
          description: Present when the party is identified by finId.
        address:
          type: string
          description: Present when the party is identified by a raw ledger address.
        assetId:
          type: string
        config:
          $ref: '#/components/schemas/whitelistConfig'
    dewhitelistInvestorResponse:
      type: object
      required:
        - removed
      properties:
        finId:
          type: string
        address:
          type: string
        assetId:
          type: string
          description: Absent when every entry for the party was removed.
        removed:
          type: integer
          description: Number of entries removed.
    whitelistRefusedResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        mechanisms:
          type: array
          description: |
            The mechanisms still blocking the party, which this deployment does
            not operate. Onboarding must be completed through them.
          items:
            type: string
    errorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Error message
